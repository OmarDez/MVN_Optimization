[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pymvn-arm"
version = "0.1.0"
description = "Phase-native inference for Multi-Valued Neuron models on Arm64"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "onnx>=1.15", "onnxruntime>=1.17", "matplotlib>=3.7"]
train = ["torch>=2.0", "torchvision>=0.15"]

[tool.setuptools.packages.find]
include = ["pymvn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
