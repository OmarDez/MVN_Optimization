name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Correctness gate. Must pass on both architectures before anything merges.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Describe host
        run: |
          uname -m
          lscpu || true
      - run: pip install -e ".[dev]"
      - name: Build angular kernel
        run: bash kernels/build.sh
      - name: Test suite
        run: pytest tests/ -v

  # Performance measurement. Same commit on x86_64 and aarch64.
  bench:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: bash kernels/build.sh

      # Records exactly how this machine is configured, so the numbers below are
      # attributable to real hardware rather than to a claim. uname/lscpu always
      # land; Arm's own sysreport is layered on top when it can be located,
      # since its script name and path have moved between revisions.
      - name: Capture host configuration
        continue-on-error: true
        run: |
          mkdir -p results
          { uname -a; echo; lscpu; } > results/hostinfo-${{ matrix.runner }}.txt
          git clone --depth 1 https://github.com/ArmDeveloperEcosystem/sysreport.git /tmp/sysreport || true
          SR=$(find /tmp/sysreport -name 'sysreport*.py' | head -1)
          [ -n "$SR" ] && python "$SR" >> results/hostinfo-${{ matrix.runner }}.txt 2>&1 || true

      - name: Benchmark
        env:
          PYMVN_THREADS: '1'
        run: |
          python bench/run_bench.py --synthetic \
            --cases head_512x10 layer_2048x64 layer_4096x256 \
            --bits 3 4 --batches 64 512 2048 --repeat 30 \
            --out results/bench-${{ matrix.runner }}.json

      # Crossover hunt: the neon/onnx ratio climbs monotonically with layer size
      # but is still below 1.0 at the largest shape here (0.887 on Neoverse N2).
      # angular_tiled is excluded deliberately -- it needs ~10.7s per iteration
      # at 4096x256 already, so it would dominate the wall time while telling us
      # nothing new.
      - name: Crossover sweep (onnx vs neon)
        env:
          PYMVN_THREADS: '1'
        run: |
          python bench/run_bench.py --synthetic \
            --cases head_512x10 layer_2048x64 layer_4096x256 \
                    layer_6144x384 layer_8192x512 \
            --backends onnx neon \
            --bits 4 --batches 2048 --repeat 30 \
            --out results/crossover-${{ matrix.runner }}.json

      # The two shapes that bracket parity: 0.961 and 1.016, so the crossover
      # lands between 9.4M and 16.8M MACs per sample. Swept at batch 256 rather
      # than 2048 because the ratio is a function of shape alone -- measured
      # stable to within a few percent across batch 64/512/2048 -- so the small
      # batch buys an 8x cheaper measurement of the same quantity. At batch 2048
      # layer_16384x1024 would cost ~7 minutes per cell and half a gigabyte of
      # complex128 activations.
      - name: Crossover tail (largest shapes, small batch)
        env:
          PYMVN_THREADS: '1'
        run: |
          python bench/run_bench.py --synthetic \
            --cases layer_12288x768 layer_16384x1024 \
            --backends onnx neon \
            --bits 4 --batches 256 --repeat 30 \
            --out results/crossover-tail-${{ matrix.runner }}.json

      # E3, on the architecture the claim is about. PLAN.md 5 asks for this to
      # run on Arm rather than x86, and it now can: the activations are a
      # committed slice, so no dataset and no torchvision are needed. Run with
      # the neon backend on Arm so the accuracy column is the kernel's own, not
      # a NumPy stand-in -- a kernel that changed the predictions would show up
      # here even if the parity tests somehow passed.
      - name: Bit-width ablation (E3)
        run: |
          BACKEND=angular_tiled
          [ "$(uname -m)" = "aarch64" ] && BACKEND=neon
          python scripts/ablate_bits.py \
            --activations tests/data/mlmvn_mnist_activations.npz \
            --backend "$BACKEND" \
            --out results/e3-${{ matrix.runner }}.json
          python bench/plot_ablation.py results/e3-${{ matrix.runner }}.json \
            --out results --name fig_bitwidth_ablation-${{ matrix.runner }}.png

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runner }}
          path: results/
