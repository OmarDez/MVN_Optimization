name: bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Correctness gate. Must pass on both architectures before anything merges.
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Describe host
        run: |
          uname -m
          lscpu || true
      - run: pip install -e ".[dev]"
      - name: Build angular kernel
        run: bash kernels/build.sh
      - name: Test suite
        run: pytest tests/ -v

  # Performance measurement. Same commit on x86_64 and aarch64.
  bench:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]"
      - run: bash kernels/build.sh

      # Arm's own system reporting tool: records exactly how this machine is
      # configured, so the numbers below are attributable to real hardware.
      - name: Capture host configuration (Arm sysreport)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/ArmDeveloperEcosystem/sysreport.git /tmp/sysreport
          python /tmp/sysreport/sysreport.py 2>&1 | tee results/sysreport-${{ matrix.runner }}.txt || true

      - name: Benchmark
        env:
          PYMVN_THREADS: '1'
        run: |
          python bench/run_bench.py --synthetic \
            --bits 3 4 --batches 64 512 2048 --repeat 30 \
            --out results/bench-${{ matrix.runner }}.json

      - uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.runner }}
          path: results/
